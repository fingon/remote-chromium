repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      # mvdan/sh stopped shipping a pre-commit manifest, so build shfmt inside
      # prek's own golang environment instead; no host tooling required.
      - id: shfmt
        name: shfmt
        entry: shfmt -w -i 4
        language: golang
        additional_dependencies: [mvdan.cc/sh/v3/cmd/shfmt@v3.13.1]
        types: [shell]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint-fix
        exclude: ^LICENSE$
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
