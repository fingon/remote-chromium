name: container

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      push:
        description: Push image to GHCR after tests pass
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether to publish
        id: publish
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "enabled=false" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) echo "enabled=${{ inputs.push }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman

      - name: Integration test (builds the image)
        env:
          ENGINE: podman
          IMAGE: localhost/hermes-chromium:trixie
        run: make test

      - name: Tag tested image
        if: steps.publish.outputs.enabled == 'true'
        run: |
          podman tag localhost/hermes-chromium:trixie "ghcr.io/${{ github.repository }}:trixie"
          podman tag localhost/hermes-chromium:trixie "ghcr.io/${{ github.repository }}:latest"

      - name: Log in to GHCR
        if: steps.publish.outputs.enabled == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: steps.publish.outputs.enabled == 'true'
        run: |
          podman push "ghcr.io/${{ github.repository }}:trixie"
          podman push "ghcr.io/${{ github.repository }}:latest"
