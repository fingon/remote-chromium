[supervisord]
nodaemon=true
logfile=/tmp/supervisor/supervisord.log
pidfile=/tmp/supervisor/supervisord.pid
childlogdir=/tmp/supervisor

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -ac +extension GLX +render -noreset
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox --replace
environment=DISPLAY="%(ENV_DISPLAY)s"
directory=/home/chromium
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:chromium]
command=/usr/local/bin/start-chromium.sh
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="%(ENV_BROWSER_HOME)s"
directory=/home/chromium
autostart=true
autorestart=true
priority=30
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:socat-cdp]
command=/usr/bin/socat TCP-LISTEN:%(ENV_CDP_PORT)s,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:%(ENV_CDP_INTERNAL_PORT)s
user=chromium
autostart=true
autorestart=true
priority=35
stdout_logfile=/tmp/supervisor/socat-cdp.out
stdout_logfile_maxbytes=5MB
stderr_logfile=/tmp/supervisor/socat-cdp.err
stderr_logfile_maxbytes=5MB

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -rfbport %(ENV_VNC_PORT)s -listen 0.0.0.0 -rfbauth /home/chromium/.vnc/passwd -noxdamage -repeat
user=chromium
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc %(ENV_NOVNC_PORT)s 127.0.0.1:%(ENV_VNC_PORT)s
user=chromium
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
